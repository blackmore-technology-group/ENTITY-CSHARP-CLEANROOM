name: Clean-room verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sealed conformance kit
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'conformance-kit'
          $lines = [System.IO.File]::ReadAllLines((Join-Path $root 'SHA256SUMS.txt'))
          foreach ($line in $lines) {
            $clean = $line.TrimStart([char]0xFEFF)
            if ([string]::IsNullOrWhiteSpace($clean)) { continue }
            $parts = $clean -split '  ', 2
            $expected = $parts[0]
            $rel = $parts[1]
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $root $rel)).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "checksum mismatch: $rel" }
          }
          Write-Host 'sealed conformance kit: SHA256SUMS PASS'
      - name: Fetch sealed v3.2 adoption kit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force adoption-conformance-kit | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/blackmore-technology-group/ENTITY/ee3587a6e65c2565eaab2e815e85415ab705ea47/protocol/v3/ENTITY_V3_2_ADOPTION_CLEANROOM_KIT.min.json' -OutFile 'adoption-conformance-kit/ENTITY_V3_2_ADOPTION_CLEANROOM_KIT.min.json'
          $actual=(Get-FileHash -Algorithm SHA256 'adoption-conformance-kit/ENTITY_V3_2_ADOPTION_CLEANROOM_KIT.min.json').Hash.ToLowerInvariant()
          if ($actual -ne '44e7a00f910c89aced3b3c1b5e9cba486809ca313e9bfb4b7bc9266095c10c14') { throw 'sealed v3.2 kit SHA-256 mismatch' }
      - name: Fetch sealed v3.3 reality kit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reality-conformance-kit | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/blackmore-technology-group/ENTITY/9c79f987207592cb6791e1a8956f23351cdfb2d3/protocol/v3/ENTITY_V3_3_REALITY_CLEANROOM_KIT.min.json' -OutFile 'reality-conformance-kit/ENTITY_V3_3_REALITY_CLEANROOM_KIT.min.json'
          $actual=(Get-FileHash -Algorithm SHA256 'reality-conformance-kit/ENTITY_V3_3_REALITY_CLEANROOM_KIT.min.json').Hash.ToLowerInvariant()
          if ($actual -ne 'f8b39ee01fb7346f33a57530e925b545d2bf9a770c7ec60724e28a4971d55a46') { throw 'sealed v3.3 kit SHA-256 mismatch' }
      - name: Fetch sealed v3.4 global passport kit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force passport-conformance-kit | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/blackmore-technology-group/ENTITY/c143ccc14def335635e7d0248353167e4956e977/protocol/v3/ENTITY_V3_4_GLOBAL_PASSPORT_CLEANROOM_KIT.min.json' -OutFile 'passport-conformance-kit/ENTITY_V3_4_GLOBAL_PASSPORT_CLEANROOM_KIT.min.json'
          $actual=(Get-FileHash -Algorithm SHA256 'passport-conformance-kit/ENTITY_V3_4_GLOBAL_PASSPORT_CLEANROOM_KIT.min.json').Hash.ToLowerInvariant()
          if ($actual -ne '5869a3fd0ed6cb9f65bf4b20c3bd64933cad82f4aef05c5809e2e05af921f230') { throw 'sealed v3.4 kit SHA-256 mismatch' }
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore and build legacy verifier
        shell: pwsh
        run: |
          nuget restore EntityCSharpCleanroom.csproj
          msbuild EntityCSharpCleanroom.csproj /p:Configuration=Release /p:RestorePackagesConfig=true
      - name: Run campaigns
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence-ci | Out-Null
          & .\bin\Release\net48\EntityCSharpCleanroom.exe test | Tee-Object -FilePath evidence-ci\cleanroom-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project adoption-v32/AdoptionV32.csproj -c Release | Tee-Object -FilePath evidence-ci\adoption-v3.2-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $a=Get-Content evidence-ci\adoption-v3.2-report.json -Raw
          if ($a -notmatch '"vectors_passed"\s*:\s*16') { throw 'v3.2 vector count mismatch' }
          if ($a -notmatch '1eb59e09ab08da86bfd8584df4a64ba331f7bbbce3d236b9b94f351606c90e18') { throw 'v3.2 result hash mismatch' }
          if ($a -notmatch '"overall_valid"\s*:\s*true') { throw 'v3.2 overall invalid' }
          (Get-FileHash -Algorithm SHA256 evidence-ci\cleanroom-report.json).Hash.ToLowerInvariant() | Out-File -Encoding ascii evidence-ci\legacy-report.sha256
          (Get-FileHash -Algorithm SHA256 evidence-ci\adoption-v3.2-report.json).Hash.ToLowerInvariant() | Out-File -Encoding ascii evidence-ci\adoption-report.sha256
          git rev-parse HEAD | Out-File -Encoding ascii evidence-ci\commit.txt
      - name: Run v3.3 reality campaign
        shell: pwsh
        run: |
          dotnet run --project reality-v33/RealityV33.csproj -c Release | Tee-Object -FilePath evidence-ci\reality-v3.3-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r=Get-Content evidence-ci\reality-v3.3-report.json -Raw
          if ($r -notmatch '"vectors_passed"\s*:\s*20') { throw 'v3.3 vector count mismatch' }
          if ($r -notmatch '82bd1f1fb328edd37a26d8ea60ede5a599c7d9af5027bffd73b9e52843b5a51d') { throw 'v3.3 result hash mismatch' }
          if ($r -notmatch '"overall_valid"\s*:\s*true') { throw 'v3.3 overall invalid' }
      - name: Run v3.4.2 global passport campaign
        shell: pwsh
        run: |
          dotnet run --project passport-v34/PassportV34.csproj -c Release | Tee-Object -FilePath evidence-ci\passport-v3.4.2-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r=Get-Content evidence-ci\passport-v3.4.2-report.json -Raw
          if ($r -notmatch '"vectors_passed"\s*:\s*26') { throw 'v3.4.2 vector count mismatch' }
          if ($r -notmatch '45af773554a7191c1b49a75c636a1106afb1de36d788bb00d7af56097b8d1b0e') { throw 'v3.4.2 result hash mismatch' }
          if ($r -notmatch '"overall_valid"\s*:\s*true') { throw 'v3.4.2 overall invalid' }
          (Get-FileHash -Algorithm SHA256 evidence-ci\passport-v3.4.2-report.json).Hash.ToLowerInvariant() | Add-Content evidence-ci\reports.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: entity-csharp-cleanroom-evidence
          path: evidence-ci/
          retention-days: 90
